services:
  mysql:
    image: mysql:8.0
    container_name: truepay-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: truepay
      MYSQL_ROOT_PASSWORD: n3u3da!
      MYSQL_USER: truepay
      MYSQL_PASSWORD: n3u3da!
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: truepay-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SERVER_PORT: 8082
      DB_URL: jdbc:mysql://mysql:3306/truepay
      DB_USER: truepay
      DB_PASSWORD: n3u3da!
    ports:
      - "8082:8082"

volumes:
  mysql_data:

