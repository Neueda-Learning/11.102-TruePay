version: '3.9'

services:
  mysql:
    image: mysql:8.0
    container_name: truepay-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-truepay}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-n3u3da!}
      MYSQL_USER: ${MYSQL_USER:-truepay}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-n3u3da!}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - truepay-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: truepay-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SERVER_PORT: ${SERVER_PORT:-8082}
      DB_URL: ${DB_URL:-jdbc:mysql://mysql:3306/truepay}
      DB_USER: ${DB_USER:-truepay}
      DB_PASSWORD: ${DB_PASSWORD:-n3u3da!}
    ports:
      - "${SERVER_PORT:-8082}:${SERVER_PORT:-8082}"
    networks:
      - truepay-network
    # Uncomment to bind logs to file
    # logging:
    #   driver: "json-file"
    #   options:
    #     max-size: "10m"
    #     max-file: "3"

volumes:
  mysql_data:
    driver: local

networks:
  truepay-network:
    driver: bridge

